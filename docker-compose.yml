services:
  univerra:
    build: .
    image: univerra-simulation:latest
    container_name: univerra
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
    volumes:
      - ./backend/uploads:/app/backend/uploads
